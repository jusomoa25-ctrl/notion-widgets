<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구독자 변동</title>
<style>
  :root { --bg:#ffffff; --fg:#1f1f1f; --sub:#787774; --line:#e8e6e3; --bar:#2e7cd6; --grid:#f0efec; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#191919; --fg:#ececec; --sub:#9b9b9b; --line:#333; --bar:#5a9fe2; --grid:#242424; } }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;padding:10px 12px}
  .head{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
  .head .t{font-size:12px;letter-spacing:2px;color:var(--sub);font-weight:700}
  .head .u{font-size:10px;color:var(--sub)}
  .stats{display:flex;margin:0 0 10px}
  .st{flex:1;text-align:center}
  .st b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .st span{font-size:10.5px;color:var(--sub)}
  svg{display:block;width:100%}
  .empty{color:var(--sub);font-size:12.5px;text-align:center;padding:22px 0 16px}
</style>
</head>
<body>
  <div class="head"><div class="t" id="title">구독자 변동</div><div class="u"><a id="hist" href="#" target="_blank" rel="noopener" hidden style="color:inherit;margin-right:8px">전체 기록 →</a><span id="upd"></span></div></div>
  <div class="stats" id="stats" hidden></div>
  <svg id="chart"></svg>
  <div class="empty" id="empty" hidden>집계된 구독자 변동이 아직 없습니다</div>
<script>
  var CH = new URLSearchParams(location.search).get("ch") || "";
  fetch("subs.json?v="+Date.now()).then(r=>r.json()).then(function(data){
    var c = data.channels[CH];
    document.getElementById("title").textContent = (c && c.name || CH || "?") + " 구독자 변동";
    if (!c) { document.getElementById("empty").hidden = false; return; }
    var mmdd = function(d){ return d.slice(5).replace("-","/"); };
    var hasProv = data.provThrough && data.provThrough > data.dataThrough;
    document.getElementById("upd").textContent = hasProv
      ? "확정 ~" + mmdd(data.dataThrough) + " · ~" + mmdd(data.provThrough) + " 잠정(자정 스냅샷)"
      : "~" + mmdd(data.dataThrough) + " · YouTube 집계는 최근 약 2일 지연";
    if (c.history) { var a = document.getElementById("hist"); a.href = c.history; a.hidden = false; }

    // days: [date, gained, lost] → net change per day
    var days = c.days.map(function(x){ return { d: x[0], g: x[1] - (x[2]||0), p: !!x[3] }; });
    var first = days.findIndex(function(x){ return x.g !== 0; });
    if (first < 0) {
      document.getElementById("empty").hidden = false;
      if (c.subs != null) {
        document.getElementById("stats").hidden = false;
        document.getElementById("stats").innerHTML = "<div class='st'><b>"+c.subs.toLocaleString()+"</b><span>현재 구독자</span></div>";
      }
      return;
    }
    var total = days.reduce(function(s,x){ return s + x.g; }, 0); // 누적은 전체 이력 기준
    days = days.slice(Math.max(0, first - 1)).slice(-30); // 위젯 노출은 최근 30일, 전체 이력은 기록 페이지

    var n = days.length;
    var last = days[n-1], peak = days.reduce(function(a,b){ return b.g > a.g ? b : a; });
    var pi = days.indexOf(peak);
    document.getElementById("stats").hidden = false;
    document.getElementById("stats").innerHTML =
      "<div class='st'><b>"+c.subs.toLocaleString()+"</b><span>현재 구독자</span></div>"+
      "<div class='st'><b>+"+total.toLocaleString()+"</b><span>누적 순증</span></div>"+
      "<div class='st'><b>+"+last.g.toLocaleString()+"</b><span>최근일 ("+mmdd(last.d)+")</span></div>";

    // ponytail: viewBox width grows with day count so every day keeps a readable label; revisit past ~60 days
    var step = 30, padL = 4, padR = 4, padT = 10, padB = 32;
    var W = padL + padR + n * step, H = 190;
    var ch = H - padT - padB, bw = step - 4;
    var svg = document.getElementById("chart");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    var max = Math.max(1, peak.g);
    var s = "";
    [0, .5, 1].forEach(function(f){
      var y = padT + ch * (1 - f);
      s += "<line x1='"+padL+"' y1='"+y+"' x2='"+(W-padR)+"' y2='"+y+"' stroke='var(--grid)' stroke-width='1'/>";
    });
    days.forEach(function(x, i){
      var h = Math.max(0, Math.round(x.g / max * ch));
      var bx = padL + i * step + (step - bw) / 2;
      var by = padT + ch - h;
      var r = Math.min(4, bw / 2, h);
      s += "<path d='M"+bx+" "+(padT+ch)+" V"+(by+r)+" Q"+bx+" "+by+" "+(bx+r)+" "+by+" H"+(bx+bw-r)+" Q"+(bx+bw)+" "+by+" "+(bx+bw)+" "+(by+r)+" V"+(padT+ch)+" Z' fill='var(--bar)'"+(x.p?" fill-opacity='0.5'":"")+"/>";
      var cx = bx + bw / 2;
      var w = (i === pi) ? 800 : 400;
      var fill = (i === pi) ? "var(--fg)" : "var(--sub)";
      s += "<text x='"+cx+"' y='"+(H-18)+"' text-anchor='middle' font-size='8.5' font-weight='"+w+"' fill='"+fill+"'>"+mmdd(x.d)+"</text>";
      s += "<text x='"+cx+"' y='"+(H-5)+"' text-anchor='middle' font-size='9.5' font-weight='"+w+"' fill='"+fill+"'>"+x.g.toLocaleString()+"</text>";
    });
    svg.innerHTML = s;
  });
</script>
</body>
</html>
