<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구독자 변동</title>
<style>
  :root { --bg:#ffffff; --fg:#1f1f1f; --sub:#787774; --line:#e8e6e3; --bar:#2e7cd6; --grid:#f0efec; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#191919; --fg:#ececec; --sub:#9b9b9b; --line:#333; --bar:#5a9fe2; --grid:#242424; } }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;padding:10px 12px}
  .head{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
  .head .t{font-size:12px;letter-spacing:2px;color:var(--sub);font-weight:700}
  .head .u{font-size:10px;color:var(--sub)}
  .stats{display:flex;margin:0 0 10px}
  .st{flex:1;text-align:center}
  .st b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .st span{font-size:10.5px;color:var(--sub)}
  .wrap{position:relative}
  svg{display:block;width:100%}
  .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;font-variant-numeric:tabular-nums}
  .empty{color:var(--sub);font-size:12.5px;text-align:center;padding:22px 0 16px}
</style>
</head>
<body>
  <div class="head"><div class="t" id="title">구독자 변동</div><div class="u" id="upd"></div></div>
  <div class="stats" id="stats" hidden></div>
  <div class="wrap"><svg id="chart"></svg><div class="tip" id="tip"></div></div>
  <div class="empty" id="empty" hidden>집계된 구독자 변동이 아직 없습니다</div>
<script>
  var CH = new URLSearchParams(location.search).get("ch") || "";
  fetch("subs.json?v="+Date.now()).then(r=>r.json()).then(function(data){
    var c = data.channels[CH];
    document.getElementById("title").textContent = (c && c.name || CH || "?") + " 구독자 변동";
    if (!c) { document.getElementById("empty").hidden = false; return; }
    var mmdd = function(d){ return d.slice(5).replace("-","/"); };
    document.getElementById("upd").textContent = "~" + mmdd(data.dataThrough) + " · YouTube 집계는 최근 약 2일 지연";

    // days: [date, gained, lost] → net change per day
    var days = c.days.map(function(x){ return { d: x[0], g: x[1] - (x[2]||0), up: x[1], dn: x[2]||0 }; });
    var first = days.findIndex(function(x){ return x.up > 0; });
    if (first < 0) {
      document.getElementById("empty").hidden = false;
      if (c.subs != null) {
        document.getElementById("stats").hidden = false;
        document.getElementById("stats").innerHTML = "<div class='st'><b>"+c.subs.toLocaleString()+"</b><span>현재 구독자</span></div>";
      }
      return;
    }
    days = days.slice(Math.max(0, first - 1));

    var n = days.length;
    var total = days.reduce(function(s,x){ return s + x.g; }, 0);
    var last = days[n-1], peak = days.reduce(function(a,b){ return b.g > a.g ? b : a; });
    document.getElementById("stats").hidden = false;
    document.getElementById("stats").innerHTML =
      "<div class='st'><b>"+c.subs.toLocaleString()+"</b><span>현재 구독자</span></div>"+
      "<div class='st'><b>+"+total.toLocaleString()+"</b><span>기간 순증</span></div>"+
      "<div class='st'><b>+"+last.g.toLocaleString()+"</b><span>최근일 ("+mmdd(last.d)+")</span></div>"+
      "<div class='st'><b>+"+peak.g.toLocaleString()+"</b><span>최고 ("+mmdd(peak.d)+")</span></div>";

    var W = 640, H = 200, padL = 6, padR = 6, padT = 26, padB = 18;
    var cw = W - padL - padR, ch = H - padT - padB;
    var max = Math.max(1, peak.g), step = cw / n, bw = Math.max(2, step - 2);
    var svg = document.getElementById("chart");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    var s = "";
    [0, .5, 1].forEach(function(f){
      var y = padT + ch * (1 - f);
      s += "<line x1='"+padL+"' y1='"+y+"' x2='"+(W-padR)+"' y2='"+y+"' stroke='var(--grid)' stroke-width='1'/>";
      if (f === .5) s += "<text x='"+(W-padR)+"' y='"+(y-3)+"' text-anchor='end' font-size='9' fill='var(--sub)'>"+Math.round(max*f)+"</text>";
    });
    var pi = days.indexOf(peak);
    days.forEach(function(x, i){
      // ponytail: negative net days render as 0-height bars; tooltip still shows the real value
      var h = Math.max(0, Math.round(x.g / max * ch));
      var bx = padL + i * step + (step - bw) / 2;
      var by = padT + ch - h;
      var r = Math.min(4, bw / 2, h);
      s += "<path d='M"+bx+" "+(padT+ch)+" V"+(by+r)+" Q"+bx+" "+by+" "+(bx+r)+" "+by+" H"+(bx+bw-r)+" Q"+(bx+bw)+" "+by+" "+(bx+bw)+" "+(by+r)+" V"+(padT+ch)+" Z' fill='var(--bar)'/>";
      var isTick = (i === 0 || i === n-1 || (i % 7 === 0 && n - i > 3));
      if (isTick) s += "<text x='"+(bx+bw/2)+"' y='"+(H-4)+"' text-anchor='middle' font-size='9' fill='var(--sub)'>"+mmdd(x.d)+"</text>";
    });
    // direct label on peak only; padT keeps it inside the viewBox
    var px = Math.min(W - padR - 14, Math.max(padL + 14, padL + pi * step + step / 2));
    var py = padT + ch - Math.round(peak.g / max * ch);
    s += "<text x='"+px+"' y='"+(py-6)+"' text-anchor='middle' font-size='10' font-weight='700' fill='var(--fg)'>+"+peak.g.toLocaleString()+"</text>";
    svg.innerHTML = s;

    var tip = document.getElementById("tip"), wrap = svg.parentNode;
    svg.addEventListener("mousemove", function(e){
      var rect = svg.getBoundingClientRect();
      var i = Math.floor((e.clientX - rect.left) / rect.width * n);
      if (i < 0 || i >= n) { tip.style.opacity = 0; return; }
      var x = days[i];
      tip.textContent = mmdd(x.d) + "  순증 " + (x.g >= 0 ? "+" : "") + x.g.toLocaleString() + " (증가 " + x.up + " · 이탈 " + x.dn + ")";
      tip.style.left = ((i + .5) / n * rect.width) + "px";
      tip.style.top = (rect.top - wrap.getBoundingClientRect().top + 16) + "px";
      tip.style.opacity = 1;
    });
    svg.addEventListener("mouseleave", function(){ tip.style.opacity = 0; });
  });
</script>
</body>
</html>
